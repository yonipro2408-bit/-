<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מה יש באזור?</title>
<meta name="theme-color" content="#F7F4EE">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#0B7A8C;--sun:#FF8A3D;--navy:#0F2A3D;--bg:#F7F4EE;--line:#E6E0D3;--mute:#5E6E7A}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--navy);font-family:Heebo,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}
/* splash */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
#splash::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:var(--sun);top:-300px;inset-inline-start:-200px;opacity:.95}
#splash::after{content:"";position:absolute;width:640px;height:640px;border-radius:50%;background:var(--teal);bottom:-420px;inset-inline-end:-260px}
#splash>*{position:relative;z-index:1}
#splash img{width:132px;animation:rise .7s ease-out both}
#splash h1{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;margin-top:18px}
#splash p{color:var(--mute);margin:8px 0 28px;max-width:26ch;font-size:1.05rem}
.btn{background:var(--navy);color:#fff;border:0;border-radius:16px;padding:16px 38px;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 8px 20px rgba(15,42,61,.25)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* top */
.top{padding:calc(16px + env(safe-area-inset-top,0px)) 0 6px}
.bar{display:flex;align-items:center;gap:10px}
.bar img{width:34px}
.bar b{font-weight:800;font-size:1.15rem}
.cityBtn{margin-inline-start:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:.88rem;font-weight:500;cursor:pointer}
h1.t{font-size:1.9rem;font-weight:800;line-height:1.1;margin:22px 0 14px;letter-spacing:-.02em}
.sbox{position:relative}
.search{display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:5px 16px 5px 5px;box-shadow:0 6px 18px rgba(15,42,61,.07)}
.search:focus-within{border-color:var(--teal)}
.search input{flex:1;border:0;background:none;padding:13px 12px;min-width:0}
.search input:focus{outline:none}
.go{background:var(--teal);color:#fff;border:0;border-radius:14px;padding:12px 20px;font-weight:700;cursor:pointer}
#sug{position:absolute;inset-inline:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 30px rgba(15,42,61,.14);z-index:20;overflow:hidden}
#sug button{display:block;width:100%;text-align:start;background:none;border:0;padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
#sug button:last-child{border:0}
#sug button:hover,#sug button:focus{background:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:.85rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--teal);color:#fff;border-color:var(--teal)}
/* categories */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 12px}
.sec h2{font-size:1.15rem;font-weight:800}
.sec button{background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.cat{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font-size:.8rem;font-weight:500;padding:0}
.cat span{width:100%;aspect-ratio:1;max-width:84px;display:grid;place-items:center;background:#fff;border:1.5px solid var(--line);border-radius:24px;transition:.15s}
.cat img{width:64%}
.cat[aria-pressed=true] span{border-color:var(--teal);box-shadow:0 0 0 3px rgba(11,122,140,.18)}
.cat[aria-pressed=true]{color:var(--teal);font-weight:700}
/* results */
.list{display:grid;gap:10px}
.place{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px}
.place .ph{flex:none;width:64px;height:64px;border-radius:16px;background:var(--bg);display:grid;place-items:center}
.place .ph img{width:70%}
.place b{display:block;font-weight:700}
.place small{color:var(--mute)}
.tag{display:inline-block;margin-top:5px;font-size:.7rem;background:#FFF1E6;color:#9A4A12;border-radius:8px;padding:2px 8px}
.fav{margin-inline-start:auto;flex:none;width:46px;height:46px;border-radius:50%;border:0;background:none;font-size:1.5rem;cursor:pointer;color:var(--mute)}
.fav[aria-pressed=true]{color:var(--sun)}
.empty{text-align:center;padding:38px 12px;color:var(--mute)}
.empty img{width:72px;margin-bottom:10px}
.empty b{display:block;color:var(--navy);font-size:1.05rem;margin-bottom:4px}
.note{margin:22px 0;font-size:.78rem;color:var(--mute)}
nav{position:fixed;inset:auto 0 0 0;background:rgba(247,244,238,.95);border-top:1px solid var(--line);display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(10px);z-index:10}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font-size:.74rem;color:var(--mute);cursor:pointer}
nav svg{width:24px;height:24px}
nav button[aria-current=page]{color:var(--teal);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section id="splash">
  <img src="assets/logo.png" alt="">
  <h1>מה יש באזור?</h1>
  <p>כל מה שיש סביבך, בכל יישוב בישראל</p>
  <button class="btn" id="start">בוא נתחיל</button>
</section>

<div id="home">
 <header class="wrap top">
  <div class="bar"><img src="assets/logo.png" alt=""><b>מה יש באזור?</b><button class="cityBtn" id="cityBtn">📍 בחר עיר</button></div>
  <h1 class="t">מה מחפשים היום?</h1>
  <div class="sbox">
   <form class="search" id="form" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="למשל: מסעדה בפתח תקווה" aria-label="חיפוש">
    <button class="go" type="submit">חפש</button>
   </form>
   <div id="sug" hidden></div>
  </div>
  <div class="chips" id="chips" aria-label="ערים נפוצות"></div>
 </header>
 <main class="wrap">
  <div class="sec"><h2>קטגוריות</h2><button id="more">הצג הכל</button></div>
  <div class="cats" id="cats"></div>
  <div class="sec"><h2 id="title">מקומות</h2><span id="count" style="color:var(--mute);font-size:.85rem"></span></div>
  <div class="list" id="list"></div>
  <p class="note">הנתונים כרגע הם דוגמאות להמחשה בלבד, ולא מקומות אמיתיים. מידע על כשרות יוצג רק ממקור מאומת.</p>
 </main>
</div>

<main class="wrap" id="favs" hidden>
 <header class="top"><h1 class="t" style="margin-top:8px">המועדפים שלי</h1></header>
 <div class="list" id="flist"></div>
</main>
<main class="wrap" id="map" hidden>
 <div class="empty" style="padding-top:90px"><img src="assets/logo.png" alt=""><b>המפה תגיע בשלב הבא</b>בחירת ספק המפות תלויה בעלויות ובאישור.</div>
</main>

<nav aria-label="ניווט ראשי">
 <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>גילוי</button>
 <button data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>מפה</button>
 <button data-tab="favs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.500A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/></svg>מועדפים</button>
</nav>

<script>
const CITIES=`ירושלים,תל אביב-יפו,חיפה,ראשון לציון,פתח תקווה,אשדוד,נתניה,באר שבע,בני ברק,חולון,רמת גן,אשקלון,רחובות,בת ים,בית שמש,כפר סבא,הרצליה,חדרה,מודיעין-מכבים-רעות,לוד,רעננה,רמלה,נצרת,עכו,נהריה,כרמיאל,טבריה,צפת,אילת,קריית שמונה,עפולה,בית שאן,טירת כרמל,קריית גת,קריית מוצקין,קריית אתא,קריית ביאליק,קריית ים,יבנה,גבעתיים,הוד השרון,נס ציונה,רמת השרון,אור יהודה,יהוד-מונוסון,דימונה,נתיבות,שדרות,אופקים,ערד,מעלות-תרשיחא,זכרון יעקב,קיסריה,פרדס חנה-כרכור,גדרה,מבשרת ציון,אריאל,מעלה אדומים,קצרין,מצפה רמון,עין גדי,ראש פינה,יקנעם עילית,נשר,טבעון,שוהם,אלעד,ביתר עילית,מודיעין עילית,נתיב הל"ה,כפר יונה,קדימה-צורן,אורנית,להבים,מיתר,עומר,רהט,טייבה,אום אל-פחם,שפרעם,סחנין`.split(',');
const CATS=[['food','אוכל','מסעדה,אוכל,מסעדות,לאכול'],['coffee','קפה','קפה,בית קפה'],['synagogue','בתי כנסת','בית כנסת,בתי כנסת,מניין,תפילה'],['trail','טיולים','טיול,מסלול,טבע'],['beach','חופים','חוף,ים'],['park','פארקים','פארק,גן'],['kids','ילדים','ילדים,אטרקציה'],['events','אירועים','אירוע,הופעה,מה קורה'],['mikveh','מקוואות','מקווה'],['museum','מוזיאונים','מוזיאון'],['nightlife','בילויים','בר,ברים,מועדון,בילוי'],['shopping','קניות','קניון,קניות,חנות'],['hotel','לינה','מלון,צימר,לינה'],['sports','ספורט','ספורט,חדר כושר,בריכה'],['health','בריאות','מרפאה,בית מרקחת,בית חולים'],['fuel','תחנות דלק','דלק,תחנת דלק']].map(([id,label,kw])=>({id,label,kw:kw.split(',')}));
const NAMES={food:'מסעדה',coffee:'בית קפה',synagogue:'בית כנסת',trail:'מסלול הליכה',beach:'חוף',park:'פארק',kids:'מתחם משחקים',events:'אירוע',mikveh:'מקווה',museum:'מוזיאון',nightlife:'בר',shopping:'מרכז קניות',hotel:'מלון',sports:'מרכז ספורט',health:'מרפאה',fuel:'תחנת דלק'};
const $=s=>document.querySelector(s), cat_=id=>CATS.find(c=>c.id===id);
const POP=['תל אביב-יפו','ירושלים','חיפה','פתח תקווה','באר שבע','נתניה','אילת','טבריה'];
let city=null,cat=null,favs=[],all=false;
try{favs=JSON.parse(localStorage.getItem('favs')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('favs',JSON.stringify(favs))}catch(e){}};
const key=(c,t)=>c+'|'+t;
function card(c,t){
 const id=key(c,t),on=favs.includes(id);
 return `<article class="place"><div class="ph"><img src="assets/icons/${t}.png" alt=""></div>
 <div><b>${NAMES[t]} לדוגמה</b><small>${c}</small><br><span class="tag">נתוני הדגמה</span></div>
 <button class="fav" data-id="${id}" aria-pressed="${on}" aria-label="${on?'הסר מהמועדפים':'שמור במועדפים'}">${on?'♥':'♡'}</button></article>`;
}
const empty=(t,s)=>`<div class="empty"><img src="assets/logo.png" alt=""><b>${t}</b>${s}</div>`;
function render(){
 document.querySelector('#cityBtn').textContent='📍 '+(city||'בחר עיר');
 document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.textContent===city));
 document.querySelectorAll('.cat').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===cat));
 $('#title').textContent=(cat?cat_(cat).label:'מומלץ')+(city?' ב'+city:'');
 let items=[];
 if(city){const ts=cat?[cat]:['food','coffee','synagogue','trail','park','kids'];ts.forEach(t=>{items.push([city,t]);if(cat)items.push([city,t,2])});}
 $('#count').textContent=items.length?items.length+' תוצאות':'';
 $('#list').innerHTML=city?items.map(i=>card(i[0]+(i[2]?' (2)':''),i[1])).join(''):empty('בחר עיר כדי להתחיל','חפש יישוב או לחץ על עיר מהרשימה למעלה.');
 const f=favs.map(k=>k.split('|'));
 $('#flist').innerHTML=f.length?f.map(x=>card(x[0],x[1])).join(''):empty('עדיין אין מועדפים','לחץ על הלב ליד מקום כדי לשמור אותו כאן.');
}
function drawCats(){$('#cats').innerHTML=CATS.slice(0,all?16:8).map(c=>`<button class="cat" data-c="${c.id}" aria-pressed="false"><span><img src="assets/icons/${c.id}.png" alt=""></span>${c.label}</button>`).join('');$('#more').textContent=all?'הצג פחות':'הצג הכל';render()}
$('#chips').innerHTML=POP.map(c=>`<button class="chip" aria-pressed="false">${c}</button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b){city=b.textContent;render()}};
$('#more').onclick=()=>{all=!all;drawCats()};
$('#cats').onclick=e=>{const b=e.target.closest('.cat');if(b){cat=cat===b.dataset.c?null:b.dataset.c;render()}};
function parse(t){
 t=t.trim();let c=null,k=null;
 CITIES.slice().sort((a,b)=>b.length-a.length).forEach(n=>{if(!c&&(t.includes(n)||t.includes(n.split('-')[0])&&n.split('-')[0].length>2))c=n});
 CATS.forEach(x=>x.kw.forEach(w=>{if(!k&&t.includes(w))k=x.id}));
 return{c,k};
}
function suggest(){
 const t=$('#q').value.trim(),box=$('#sug');
 if(!t){box.hidden=true;return}
 const last=t.split(' ').slice(-1)[0];
 const m=CITIES.filter(n=>n.includes(last)).slice(0,5);
 box.innerHTML=m.map(n=>`<button type="button" data-city="${n}">📍 ${n}</button>`).join('');
 box.hidden=!m.length;
}
$('#q').addEventListener('input',suggest);
$('#sug').onclick=e=>{const b=e.target.closest('button');if(!b)return;city=b.dataset.city;$('#q').value='';$('#sug').hidden=true;render();$('#list').scrollIntoView({behavior:'smooth'})};
$('#form').onsubmit=e=>{
 e.preventDefault();const r=parse($('#q').value);$('#sug').hidden=true;
 if(r.c)city=r.c;if(r.k)cat=r.k;
 if(!r.c&&!r.k){$('#list').innerHTML=empty('לא מצאנו יישוב או קטגוריה','נסה לכתוב שם של עיר, למשל "פתח תקווה", או "מסעדה בחיפה".');$('#count').textContent='';return}
 render();$('#list').scrollIntoView({behavior:'smooth'});
};
$('#cityBtn').onclick=()=>{$('#q').focus();$('#q').scrollIntoView({block:'center',behavior:'smooth'})};
document.addEventListener('click',e=>{
 const b=e.target.closest('.fav');if(!b)return;const id=b.dataset.id;
 favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save();render();
});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');
 $('#home').hidden=b.dataset.tab!=='home';$('#favs').hidden=b.dataset.tab!=='favs';$('#map').hidden=b.dataset.tab!=='map';scrollTo(0,0);
});
$('#start').onclick=()=>{$('#splash').hidden=true;try{sessionStorage.setItem('s','1')}catch(e){}};
try{if(sessionStorage.getItem('s'))$('#splash').hidden=true}catch(e){}
drawCats();
</script>
</body>
</html>
