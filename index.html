<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מה יש באזור?</title>
<meta name="theme-color" content="#075866">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#0B7A8C;--deep:#064B58;--sun:#FF8A3D;--navy:#0F2A3D;--bg:#F5F2EB;--line:#E7E2D6;--mute:#64727D}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--navy);font-family:Heebo,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;background:radial-gradient(circle at 80% 8%,rgba(255,138,61,.55),transparent 38%),linear-gradient(160deg,#0B7A8C,#043842 80%)}
.tile{width:116px;height:116px;border-radius:30px;background:var(--bg);display:grid;place-items:center;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:rise .7s ease-out both}
.tile img{width:62%}
#splash h1{font-size:2.5rem;font-weight:800;letter-spacing:-.02em;margin-top:26px}
#splash p{opacity:.85;margin:8px 0 34px;font-size:1.05rem}
.btn{background:var(--sun);color:var(--navy);border:0;border-radius:16px;padding:16px 46px;font-weight:800;font-size:1.05rem;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero{color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 0 54px;border-radius:0 0 34px 34px;background:radial-gradient(circle at 90% 0%,rgba(255,138,61,.5),transparent 42%),linear-gradient(165deg,#0B7A8C,#054653)}
.bar{display:flex;align-items:center;gap:10px}
.bar .tile{width:36px;height:36px;border-radius:11px;box-shadow:none;animation:none}
.bar b{font-weight:800}
.pill{margin-inline-start:auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:8px 14px;font-size:.85rem;cursor:pointer;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero h1{font-size:1.85rem;font-weight:800;line-height:1.15;margin:26px 0 16px;letter-spacing:-.02em}
.sbox{position:relative}
.search{display:flex;align-items:center;background:#fff;border-radius:18px;padding:5px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.search input{flex:1;border:0;background:none;padding:13px 14px;min-width:0;color:var(--navy)}
.search input:focus{outline:none}
.go{background:var(--navy);color:#fff;border:0;border-radius:14px;padding:12px 22px;font-weight:700;cursor:pointer}
#sug{position:absolute;inset-inline:0;top:calc(100% + 8px);background:#fff;border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.25);z-index:20;overflow:hidden}
#sug button{display:block;width:100%;text-align:start;background:none;border:0;padding:13px 16px;cursor:pointer;color:var(--navy);border-bottom:1px solid var(--line)}
#sug button:last-child{border:0}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.row::-webkit-scrollbar{display:none}
.hero .row{margin-top:14px}
.chip{flex:none;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:7px 14px;font-size:.84rem;cursor:pointer}
.chip.on{background:#fff;color:var(--deep);font-weight:700}
.cats{margin-top:-26px}
.cats .row{padding:4px 18px 10px;gap:10px}
.cat{flex:none;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:9px 14px 9px 12px;cursor:pointer;font-weight:500;box-shadow:0 4px 12px rgba(15,42,61,.06)}
.cat img{width:30px;height:30px}
.cat[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.cat[aria-pressed=true] img{background:var(--bg);border-radius:8px;padding:2px}
.tools{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:.84rem;color:var(--mute)}
.tools .row{flex:1}
.f{flex:none;background:none;border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:.8rem;cursor:pointer;color:var(--navy)}
.f.on{background:var(--teal);border-color:var(--teal);color:#fff}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 10px}
.sec h2{font-size:1.15rem;font-weight:800}
.sec span{color:var(--mute);font-size:.85rem}
.list{display:grid;gap:10px}
.place{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:start}
.place .ph{width:48px;height:48px;border-radius:14px;background:var(--bg);display:grid;place-items:center}
.place .ph img{width:70%}
.place b{font-weight:700;display:block;line-height:1.25}
.meta{color:var(--mute);font-size:.84rem;margin-top:3px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bd{font-size:.74rem;border-radius:8px;padding:3px 9px;background:#EEF1F3;color:#4A5964}
.bd.k{background:#E4F4EC;color:#1B7A4D;font-weight:700}
.bd.n{background:#FDE9E4;color:#A63A22}
.acts{display:flex;gap:14px;margin-top:10px}
.acts a{color:var(--teal);font-weight:700;font-size:.85rem;text-decoration:none}
.fav{width:42px;height:42px;border:0;background:none;font-size:1.45rem;cursor:pointer;color:#A5AFB6;border-radius:50%}
.fav[aria-pressed=true]{color:var(--sun)}
.sk{height:96px;border-radius:18px;background:linear-gradient(90deg,#ECE8DD 25%,#F6F3EC 50%,#ECE8DD 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:34px 14px;color:var(--mute);line-height:1.5}
.empty b{display:block;color:var(--navy);font-size:1.05rem;margin-bottom:4px}
.empty button{margin-top:12px;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:10px 20px;cursor:pointer}
.note{margin:20px 0;font-size:.76rem;color:var(--mute);line-height:1.5}
.note a{color:var(--teal)}
iframe{width:100%;height:60vh;border:0;border-radius:20px;margin-top:14px}
nav{position:fixed;inset:auto 0 0 0;background:rgba(245,242,235,.95);border-top:1px solid var(--line);display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(10px);z-index:10}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font-size:.74rem;color:var(--mute);cursor:pointer}
nav svg{width:24px;height:24px}
nav button[aria-current=page]{color:var(--teal);font-weight:700}
.top2{padding:calc(20px + env(safe-area-inset-top,0px)) 0 4px}
.top2 h1{font-size:1.6rem;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<section id="splash">
 <div class="tile"><img data-img="logo" alt=""></div>
 <h1>מה יש באזור?</h1>
 <p>מסעדות, בתי כנסת, טיולים ועוד. בכל יישוב בישראל.</p>
 <button class="btn" id="start">בוא נתחיל</button>
</section>

<div id="home">
 <header class="hero"><div class="wrap">
  <div class="bar"><div class="tile"><img data-img="logo" alt=""></div><b>מה יש באזור?</b><button class="pill" id="locBtn">📍 המיקום שלי</button></div>
  <h1>מה יש סביבך?</h1>
  <div class="sbox">
   <form class="search" id="form" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="עיר, יישוב או: מסעדה בחיפה" aria-label="חיפוש">
    <button class="go" type="submit">חפש</button>
   </form>
   <div id="sug" hidden></div>
  </div>
  <div class="row" id="chips" aria-label="ערים נפוצות"></div>
 </div></header>
 <section class="cats"><div class="wrap" style="padding:0"><div class="row" id="cats" role="group" aria-label="קטגוריות"></div></div></section>
 <main class="wrap">
  <div class="tools" id="tools"></div>
  <div class="sec"><h2 id="title">בחר מקום וקטגוריה</h2><span id="count"></span></div>
  <div class="list" id="list"></div>
  <p class="note">הנתונים מגיעים ממאגר OpenStreetMap הפתוח (© תורמי <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>). הכיסוי משתנה בין אזורים, ומידע הכשרות מופיע רק היכן שנוסף למאגר, ואינו תחליף לתעודת כשרות.</p>
 </main>
</div>

<main class="wrap" id="map" hidden><div class="top2"><h1>מפה</h1></div><div id="mapbox"></div></main>

 <button data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>מפה</button>

</nav>

async function geocode(q){
 for(const t of [q,q.replace(/^ב-?/,'')]){
  if(!t)continue;
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=il&accept-language=he&q='+encodeURIComponent(t));
   const j=await r.json();if(j[0])return{name:t,lat:+j[0].lat,lon:+j[0].lon}}catch(e){}
 }return null;
}
async function overpass(body){
 for(const u of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){
  try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(body),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
   if(r.ok)return(await r.json()).elements}catch(e){}
 }throw new Error('x');
}

 const bd=(p.cat==='food'||p.cat==='coffee')?(kt?`<span class="bd ${p.kosher==='no'?'n':'k'}">${kt}</span>`:'<span class="bd">כשרות לא ידועה</span>'):'';
 return `<article class="place"><div class="ph"><img src="${IMG[p.cat]}" alt=""></div>
 <div><b>${esc(p.name)}</b><div class="meta">${SING[p.cat]}${p.d!=null?' · '+(p.d<1?Math.round(p.d*10)*100+' מ׳':p.d.toFixed(1)+' ק״מ'):''}${p.addr?' · '+esc(p.addr):''}</div>
 <div class="badges">${bd}</div>
 <div class="acts"><a href="https://waze.com/ul?ll=${p.lat},${p.lon}&navigate=yes" target="_blank" rel="noopener">ניווט ב-Waze</a><a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}" target="_blank" rel="noopener">Google Maps</a>${p.phone?`<a href="tel:${esc(p.phone)}">התקשר</a>`:''}</div></div>
 <button class="fav" data-id="${p.id}" aria-pressed="${on}" aria-label="${on?'הסר מהמועדפים':'שמור במועדפים'}">${on?'♥':'♡'}</button></article>`;
}
function paint(skip){
 $('#locBtn').textContent='📍 '+(place?place.name:'המיקום שלי');
 document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',place&&x.textContent===place.name));
 document.querySelectorAll('.cat').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===cat));
 const food=cat==='food'||cat==='coffee';
 $('#tools').innerHTML=place?`<div class="row">${[1,3,5,10].map(r=>`<button class="f ${r===rad?'on':''}" data-r="${r}">${r} ק״מ</button>`).join('')}${food?[['all','הכל'],['yes','כשר'],['dairy','חלבי'],['meat','בשרי'],['no','לא כשר']].map(([v,l])=>`<button class="f ${v===kf?'on':''}" data-k="${v}">${l}</button>`).join(''):''}</div>`:'';
 $('#title').textContent=place&&cat?cat_(cat).label+' ליד '+place.name:'בחר מקום וקטגוריה';
 if(skip)return;
 if(!place){$('#list').innerHTML=empty('איפה אתה?','כתוב שם של עיר או יישוב, בחר מהרשימה, או לחץ על "המיקום שלי".');$('#count').textContent='';return}
 if(!cat){$('#list').innerHTML=empty('מה מחפשים?','בחר קטגוריה מהרשימה למעלה.');$('#count').textContent='';return}
 const v=res.filter(p=>!food||kf==='all'||(kf==='yes'?['yes','dairy','meat'].includes(p.kosher):p.kosher===kf));
 $('#count').textContent=v.length+' תוצאות';
 $('#list').innerHTML=v.length?v.slice(0,60).map(card).join(''):empty('לא נמצאו תוצאות','נסה להגדיל את הרדיוס, או קטגוריה אחרת. הכיסוי במאגר משתנה בין אזורים.'+(food&&kf!=='all'?' מידע כשרות קיים רק בחלק מהמקומות.':''));
}
function setPlace(p){place=p;if(!cat)cat='food';load()}
async function go(text){
 text=text.trim();let k=null,rest=text;
 CATS.flatMap(c=>c.kw.map(w=>[w,c.id])).sort((a,b)=>b[0].length-a[0].length).forEach(([w,id])=>{if(!k&&rest.includes(w)){k=id;rest=rest.replace(w,' ')}});
 rest=rest.replace(/\s+/g,' ').trim();
 if(k)cat=k;
 if(!rest){if(place)load();else paint();return}
 $('#list').innerHTML=sk();
 const c=CITIES.slice().sort((a,b)=>b.length-a.length).find(n=>rest.includes(n));
 const g=await geocode(c||rest);
 if(!g){$('#list').innerHTML=empty('לא מצאנו את היישוב','בדוק את האיות או נסה שם אחר.');return}
 setPlace(g);
}
$('#chips').innerHTML=POP.map(c=>`<button class="chip">${c}</button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b)go(b.textContent)};
$('#cats').innerHTML=CATS.map(c=>`<button class="cat" data-c="${c.id}" aria-pressed="false"><img src="${IMG[c.id]}" alt="">${c.label}</button>`).join('');
$('#cats').onclick=e=>{const b=e.target.closest('.cat');if(!b)return;cat=b.dataset.c;kf='all';place?load():paint()};
$('#tools').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.r){rad=+b.dataset.r;load()}else{kf=b.dataset.k;paint()}};
$('#list').onclick=e=>{if(e.target.id==='retry')load()};
$('#q').addEventListener('input',()=>{
 const t=$('#q').value.trim(),w=t.split(' ').pop(),m=w.length>1?CITIES.filter(n=>n.includes(w)).slice(0,5):[];
 $('#sug').innerHTML=m.map(n=>`<button type="button" data-c="${n}">📍 ${n}</button>`).join('');$('#sug').hidden=!m.length;
});
$('#sug').onclick=e=>{const b=e.target.closest('button');if(b){$('#q').value='';$('#sug').hidden=true;go(b.dataset.c)}};
$('#form').onsubmit=e=>{e.preventDefault();$('#sug').hidden=true;go($('#q').value);$('#list').scrollIntoView({behavior:'smooth'})};
$('#locBtn').onclick=()=>{
 if(!navigator.geolocation){$('#q').focus();return}
 navigator.geolocation.getCurrentPosition(p=>setPlace({name:'המיקום שלי',lat:p.coords.latitude,lon:p.coords.longitude}),()=>{$('#list').innerHTML=empty('אין גישה למיקום','אפשר גישה למיקום בדפדפן, או כתוב שם של עיר.')},{timeout:10000});
};
document.addEventListener('click',e=>{const b=e.target.closest('.fav');if(!b)return;const id=b.dataset.id,p=res.find(x=>x.id===id)||favs[id];
 if(favs[id])delete favs[id];else favs[id]=p;save();paint();drawFavs()});
function drawFavs(){const f=Object.values(favs);$('#flist').innerHTML=f.length?f.map(card).join(''):empty('עדיין אין מועדפים','לחץ על הלב ליד מקום כדי לשמור אותו כאן.')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');
 const t=b.dataset.tab;$('#home').hidden=t!=='home';$('#favs').hidden=t!=='favs';$('#map').hidden=t!=='map';scrollTo(0,0);
 if(t==='favs')drawFavs();
 if(t==='map'){const la=place?place.lat:31.5,lo=place?place.lon:34.9,d=place?.03:1.2;
  $('#mapbox').innerHTML=`<iframe title="מפה" src="https://www.openstreetmap.org/export/embed.html?bbox=${lo-d},${la-d},${lo+d},${la+d}&layer=mapnik${place?`&marker=${la},${lo}`:''}"></iframe>`}
});
$('#start').onclick=()=>{$('#splash').hidden=true;try{sessionStorage.setItem('s','1')}catch(e){}};
try{if(sessionStorage.getItem('s'))$('#splash').hidden=true}catch(e){}
paint();
</script>
</body>
</html>
